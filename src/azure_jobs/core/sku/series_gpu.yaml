# Series → (gpu_model, gpu_memory_gb) catalog
#
# Azure VC quota API returns series IDs that differ from internal family
# keys in sku_families.yaml (e.g. "ND_A100_v4" vs "NDAMv4"). This file
# maps the *API-format* IDs so quota tables can show accelerator + memory
# columns.

# ── A100 ─────────────────────────────────────────────────────────────────
ND_A100_v4:        [A100, 80]
NC_A100_v4:        [A100, 80]
NDAMv4:            [A100, 80]
NDAMv4_SAT:        [A100, 80]
NDv4:              [A100, 40]

# ── H100 ─────────────────────────────────────────────────────────────────
