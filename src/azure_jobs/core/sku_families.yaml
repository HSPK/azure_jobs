# Singularity instance family catalog
#
# Source: amlt sing_instance_fallback.json (authoritative).
# For GPU families we pick the IB+NvLink variant (most capable) per GPU count.
# For CPU families we list representative sizes.
#
# Edit this file to add a new VC family. The structure is:
#
#   <family_id>:
#     cpu: bool                  # True for CPU families
#     gpu_model: str | null
#     gpu_memory: int            # GB (GPU families only)
#     nvlink: bool               # GPU families only
#     instances_by_gpu:          # GPU families
#       <gpu_count>: <instance_name>
#     instances:                 # CPU families — sorted small→large
#       - <instance_name>

# ── CPU families ──────────────────────────────────────────────────────────
Eadsv5:
  cpu: true
  gpu_model: null
  instances: [E4ads_v5, E8ads_v5, E16ads_v5, E32ads_v5, E64ads_v5]

Dv3:
  cpu: true
  gpu_model: null
  instances: [D4_v3, D8_v3, D16_v3, D32_v3, D64_v3]

# ── A100 80GB (NDAMv4) — NvLink + IB 8-GPU, or fractional ─────────────────
NDAMv4:
  cpu: false
  gpu_model: A100
  gpu_memory: 80
  nvlink: true
  instances_by_gpu:
    1: ND12am_A100_v4
    2: ND24am_A100_v4
    4: ND48am_A100_v4
    8: ND96amrs_A100_v4

# ── A100 80GB (NC_A100_v4) — no NvLink, 1-4 GPU ───────────────────────────
NC_A100_v4:
  cpu: false
  gpu_model: A100
  gpu_memory: 80
  nvlink: false
  instances_by_gpu:
    1: NC24ad_A100_v4
    2: NC48ad_A100_v4
    4: NC96ad_A100_v4

# ── A100 40GB (NDv4) ──────────────────────────────────────────────────────
# Note: amlt shorthand convention does NOT add ``-NvLink`` for NDv4
# (it is reserved for NDAMv4 / 80GB). Keep nvlink=false to match.
NDv4:
  cpu: false
  gpu_model: A100
  gpu_memory: 40
  nvlink: false
  instances_by_gpu:
    1: ND12_v4
    2: ND24_v4
    4: ND48_v4
    8: ND96rs_v4

# ── H100 80GB (NDH100v5) ──────────────────────────────────────────────────
NDH100v5:
  cpu: false
  gpu_model: H100
  gpu_memory: 80
  nvlink: true
  instances_by_gpu:
    1: ND12_H100_v5
    2: ND24_H100_v5
    4: ND48_H100_v5
    8: ND96r_H100_v5

# ── H200 141GB (NDH200v5) — not in fallback JSON yet, using naming convention
NDH200v5:
  cpu: false
  gpu_model: H200
  gpu_memory: 141
  nvlink: true
  instances_by_gpu:
    1: ND12_H200_v5
    2: ND24_H200_v5
    4: ND48_H200_v5
    8: ND96r_H200_v5

# ── MI200 64GB (NDMI200v4) — AMD xGMI ────────────────────────────────────
NDMI200v4:
  cpu: false
  gpu_model: MI200
  gpu_memory: 64
  nvlink: false
  instances_by_gpu:
    2: ND12as_MI200_v4
    4: ND24as_MI200_v4
    8: ND48as_MI200_v4
    16: ND96asr_MI200_v4

# ── MI300X 192GB (NDMI300Xv4 / v5) — AMD xGMI ────────────────────────────
NDMI300Xv4: &NDMI300X
  cpu: false
  gpu_model: MI300X
  gpu_memory: 192
  nvlink: false
  instances_by_gpu:
    1: ND12is_MI300X_v5
    2: ND24is_MI300X_v5
    4: ND48is_MI300X_v5
    8: ND96isr_MI300X_v5

NDMI300Xv5: *NDMI300X

# ── V100 32GB (NDv2) ──────────────────────────────────────────────────────
NDv2:
  cpu: false
  gpu_model: V100
  gpu_memory: 32
  nvlink: true
  instances_by_gpu:
    1: ND5_v2
    2: ND10_v2
    4: ND20_v2
    8: ND40rs_v2

# ── H100 80GB (LMD_BM_GPUH100) — OCI ──────────────────────────────────────
LMD_BM_GPUH100:
  cpu: false
