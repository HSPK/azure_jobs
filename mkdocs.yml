site_name: Azure Jobs
site_description: Daemon-backed CLI, TUI, and SDK for Azure ML job workflows.
site_url: https://hspk.github.io/azure_jobs/
repo_url: https://github.com/HSPK/azure_jobs
repo_name: HSPK/azure_jobs
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  icon:
    logo: material/rocket-launch
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

nav:
  - Home: index.md
  - User guide:
      - Getting started: getting-started.md
      - Templates: templates.md
      - Submitting: submitting.md
      - Jobs: jobs.md
      - Resources and configuration: resources.md
      - Agent Skill: skills.md
      - Kubernetes: kubernetes.md
  - Python SDK: sdk.md
  - Reference:
      - Environment variables: environment.md
      - HTTP and Azure APIs: api.md
  - Internals:
      - Architecture: architecture.md
      - Development: development.md
      - Testing: testing.md
      - Agent guide: agent-guide.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.details
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/HSPK/azure_jobs
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/azure-jobs/
  generator: false

copyright: Copyright &copy; 2026 Azure Jobs contributors
